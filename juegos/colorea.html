<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Colorea el cuento · Angelito Burlón</title>
<meta name="description" content="Colorea en la pantalla las láminas del cuento Angelito Burlón y la estrella de Navidad.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Kurale&family=Nunito:wght@400;800&display=swap">
<link rel="stylesheet" href="juegos.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1f3aa6 0%,var(--noche) 70%) fixed}
main{max-width:1200px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left)) 40px;display:grid;gap:14px}
.mesa{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
@media (max-width:760px){.mesa{grid-template-columns:1fr}}
.paleta{display:grid;grid-template-columns:repeat(2,52px);gap:10px;padding:12px;border-radius:22px;background:rgba(255,255,255,.08)}
@media (max-width:760px){.paleta{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));order:2}}
.color{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.6);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);padding:0}
.color[aria-pressed="true"]{border-color:#fff;outline:3px solid var(--oro);outline-offset:2px;transform:scale(1.08)}
.herr{grid-column:1/-1;display:grid;gap:8px}
@media (max-width:760px){.herr{grid-template-columns:repeat(3,1fr)}}
.herr .btn{padding:10px 8px;font-size:.9rem}
.lienzo{position:relative;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.45);border:4px solid var(--oro)}
canvas{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}
.laminas{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.laminas button{flex:0 0 auto;width:120px;aspect-ratio:3/2;border-radius:12px;border:3px solid transparent;padding:0;background:#fff;overflow:hidden}
.laminas button[aria-pressed="true"]{border-color:var(--oro)}
.laminas img{width:100%;height:100%;object-fit:cover}
.pista{font-family:var(--f-cuento);color:#dfe5ff;margin:0;text-align:center}
</style>
</head>
<body>
<header class="barra">
  <a class="volver" href="../index.html#juego" aria-label="Volver a la web"><span aria-hidden="true">←</span> Volver</a>
  <h1>Colorea el cuento</h1>
</header>
<main>
  <p class="pista">Elige un color y toca dentro del dibujo para pintarlo.</p>
  <div class="laminas" id="laminas" role="group" aria-label="Elige lámina"></div>
  <div class="mesa">
    <div class="paleta" id="paleta" role="group" aria-label="Colores">
      <div class="herr">
        <button class="btn sec" id="deshacer" type="button">↶ Deshacer</button>
        <button class="btn sec" id="borrar" type="button">Empezar</button>
        <button class="btn" id="guardar" type="button">Guardar</button>
      </div>
    </div>
    <div class="lienzo"><canvas id="lienzo" width="1200" height="800" aria-label="Lámina para colorear"></canvas></div>
  </div>
</main>
<script src="comun.js"></script>
<script>
(()=>{
const LAM=['escena06','escena02','escena03','escena04','escena05','escena07','escena08','escena10a'];
const COLORES=['#f5c451','#ffe7a3','#ff8a3d','#e2445c','#ff9ec4','#8e5bd6','#3b5bdb','#74c0fc','#2f9e5b','#a9e34b','#8a5a2b','#f1c7a1','#ffffff','#868e96','#1d2454'];
const cv=document.getElementById('lienzo'),cx=cv.getContext('2d',{willReadFrequently:true});
const W=1200,H=800;let lineas=null,lineaImg=null,color=COLORES[0],pintura,historial=[],actual=AB.guarda.get('angelito-colorea-lam',LAM[0]);
const pal=document.getElementById('paleta'),herr=pal.querySelector('.herr');
COLORES.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='color';b.style.background=c;b.setAttribute('aria-label','Color '+c);
  b.addEventListener('click',()=>{color=c;pal.querySelectorAll('.color').forEach(x=>x.setAttribute('aria-pressed',x===b));AB.nota(660,.08)});pal.insertBefore(b,herr)});
pal.querySelector('.color').setAttribute('aria-pressed','true');
const L=document.getElementById('laminas');
LAM.forEach(k=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<img src="../img/juegos/colorea-${k}.png" alt="" loading="lazy">`;b.setAttribute('aria-label','Lámina '+k);b.dataset.k=k;
  b.addEventListener('click',()=>carga(k));L.appendChild(b)});
function carga(k){actual=k;AB.guarda.set('angelito-colorea-lam',k);L.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
  const im=new Image();im.onload=()=>{const o=document.createElement('canvas');o.width=W;o.height=H;const ox=o.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,W,H);ox.drawImage(im,0,0,W,H);
    const d=ox.getImageData(0,0,W,H).data;lineas=new Uint8Array(W*H);for(let i=0;i<W*H;i++)lineas[i]=d[i*4]<128?1:0;
    lineaImg=o;pintura=new ImageData(W,H);pintura.data.fill(255);historial=[];
    const guardada=AB.guarda.get('angelito-colorea-'+k,null);if(guardada){const g=new Image();g.onload=()=>{const t=document.createElement('canvas');t.width=W;t.height=H;const tx=t.getContext('2d');tx.drawImage(g,0,0);pintura=tx.getImageData(0,0,W,H);dibuja()};g.src=guardada}
    dibuja()};im.src=`../img/juegos/colorea-${k}.png`}
function dibuja(){cx.putImageData(pintura,0,0);cx.globalCompositeOperation='multiply';cx.drawImage(lineaImg,0,0);cx.globalCompositeOperation='source-over'}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function rellena(x,y){if(!lineas)return;let p=y*W+x;
  if(lineas[p]){let enc=false;for(let r=1;r<6&&!enc;r++)for(let dy=-r;dy<=r&&!enc;dy++)for(let dx=-r;dx<=r;dx++){const q=(y+dy)*W+(x+dx);if(x+dx>=0&&x+dx<W&&y+dy>=0&&y+dy<H&&!lineas[q]){p=q;enc=true;break}}if(!enc)return}
  const [r,g,b]=hex(color),d=pintura.data;if(d[p*4]===r&&d[p*4+1]===g&&d[p*4+2]===b)return;
  historial.push(new Uint8ClampedArray(d));if(historial.length>15)historial.shift();
  const visto=new Uint8Array(W*H),pila=[p];
  while(pila.length){const q=pila.pop();if(visto[q]||lineas[q])continue;let xi=q%W,yi=(q-xi)/W,l=xi,rr=xi;
    while(l>0&&!lineas[yi*W+l-1]&&!visto[yi*W+l-1])l--;while(rr<W-1&&!lineas[yi*W+rr+1]&&!visto[yi*W+rr+1])rr++;
    for(let i=l;i<=rr;i++){const k=yi*W+i;visto[k]=1;d[k*4]=r;d[k*4+1]=g;d[k*4+2]=b;
      if(yi>0&&!visto[k-W]&&!lineas[k-W])pila.push(k-W);if(yi<H-1&&!visto[k+W]&&!lineas[k+W])pila.push(k+W)}}
  dibuja();AB.nota(500+Math.random()*300,.12);guarda()}
let tGuarda;function guarda(){clearTimeout(tGuarda);tGuarda=setTimeout(()=>{const t=document.createElement('canvas');t.width=W;t.height=H;t.getContext('2d').putImageData(pintura,0,0);AB.guarda.set('angelito-colorea-'+actual,t.toDataURL('image/png'))},600)}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();rellena(Math.floor((e.clientX-r.left)*W/r.width),Math.floor((e.clientY-r.top)*H/r.height))});
document.getElementById('deshacer').addEventListener('click',()=>{if(!historial.length)return;pintura=new ImageData(historial.pop(),W,H);dibuja();guarda()});
document.getElementById('borrar').addEventListener('click',()=>{historial.push(new Uint8ClampedArray(pintura.data));pintura.data.fill(255);dibuja();guarda()});
document.getElementById('guardar').addEventListener('click',()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`angelito-burlon-${actual}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});AB.fanfarria()});
carga(LAM.includes(actual)?actual:LAM[0]);
})();
</script>
</body>
</html>
