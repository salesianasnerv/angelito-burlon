<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Calendario de Adviento · Angelito Burlón</title>
<meta name="description" content="Calendario de Adviento del Angelito Burlón: cada día una travesura y un reto.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Kurale&family=Nunito:wght@400;800&display=swap">
<link rel="stylesheet" href="juegos.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1f3aa6 0%,var(--noche) 70%) fixed}
main{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 40px;display:grid;gap:16px;justify-items:center}
.intro{font-family:var(--f-cuento);font-size:1.15rem;color:#dfe5ff;text-align:center;margin:0;max-width:720px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;width:100%}
.puerta{position:relative;aspect-ratio:1;border-radius:18px;border:0;padding:0;perspective:600px;background:var(--papel);box-shadow:inset 0 0 0 3px rgba(245,196,81,.6)}
.puerta .tapa{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;align-content:center;gap:2px;transform-origin:0 50%;transition:transform .7s cubic-bezier(.3,1.2,.5,1);backface-visibility:hidden;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.25),transparent 40%),var(--c);box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.35);color:#fff6e6}
.puerta .tapa b{font-family:var(--f-titulo);font-size:2.4rem;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.puerta .tapa small{font-weight:800;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.puerta .dentro{position:absolute;inset:0;display:grid;place-items:center;padding:8px}
.puerta .dentro img{width:70%}
.puerta.abierta .tapa{transform:rotateY(-105deg)}
.puerta.cerrada .tapa::after{content:"🔒";position:absolute;right:8px;bottom:6px;font-size:.9rem;opacity:.75}
.puerta.hoy .tapa{box-shadow:0 0 0 4px #fff,0 0 26px rgba(255,231,163,.9)}
.puerta.domingo .tapa::before{content:"🕯️";position:absolute;left:8px;top:6px;font-size:1rem}
.opciones{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
label.profe{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--oro-claro);cursor:pointer}
label.profe input{width:20px;height:20px;accent-color:var(--oro)}
.caja .reto{background:rgba(245,196,81,.2);border:2px dashed #c9931e;border-radius:16px;padding:10px 14px;font-family:var(--f-ui)!important;font-weight:800;color:var(--tinta)!important}
.caja .fecha{font-weight:800;color:var(--oro-ink)!important;font-family:var(--f-ui)!important;font-size:.9rem!important;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<header class="barra">
  <a class="volver" href="../index.html#juego" aria-label="Volver a la web"><span aria-hidden="true">←</span> Volver</a>
  <h1>Calendario de Adviento</h1>
  <span class="marca" id="marca"></span>
</header>
<main>
  <p class="intro">Cada día de Adviento se abre una ventanita con una travesura del Angelito Burlón y un reto para el día. ¡Las ventanas se abren cuando llega su día!</p>
  <div class="opciones">
    <label class="profe"><input type="checkbox" id="profe"> Modo profe: abrir cualquier día</label>
    <button class="btn sec" id="cerrar" type="button">Cerrar todas</button>
  </div>
  <div class="rejilla" id="rejilla"></div>
</main>
<div class="panel" id="final" hidden>
  <div class="caja">
    <img class="angel" id="angelDia" src="../img/personaje/angelito-risa.webp" alt="">
    <p class="fecha" id="fecha"></p>
    <h2 id="titulo"></h2>
    <p id="travesura"></p>
    <p class="reto" id="reto"></p>
    <div class="niveles"><button class="btn" id="vale" type="button">¡Reto aceptado!</button></div>
  </div>
</div>
<script src="comun.js"></script>
<script>
(()=>{
// Adviento 2026: del domingo 29 de noviembre al 24 de diciembre
const INICIO=new Date(2026,10,29);
const DIAS=[
  ['¡Empieza el Adviento!','El angelito ha encendido la primera vela de la corona… ¡y casi se quema las plumas!','Encended juntos la primera vela y pensad: ¿cómo vamos a preparar el corazón para Jesús?'],
  ['Los lápices bailarines','Esta noche el angelito ha cambiado los lápices de estuche. ¡Ji, ji, ji!','Presta tus colores a quien los necesite hoy.'],
  ['¿Quién ha sido?','Alguien ha dibujado una estrellita en la pizarra… ¡y tiene alas!','Dibuja una estrella para alguien de tu familia y regálasela.'],
  ['El abrigo al revés','El angelito se ha puesto el abrigo del revés para hacer reír a todos.','Haz reír a un compañero que esté triste.'],
  ['Silencio, que duerme','El angelito se ha quedado dormido en la estantería después de volar toda la noche.','Hoy trabajamos en silencio un ratito para no despertarlo.'],
  ['Una nota escondida','Ha dejado una nota en la puerta: «¡Jesús está por llegar!».','Escribe o dibuja una nota bonita y déjala escondida para que alguien la encuentre.'],
  ['Zapatos cambiados','Ha cambiado los zapatos de sitio en la entrada… ¡qué lío!','Ordena algo sin que te lo pidan: tu mesa, tu cuarto o la estantería.'],
  ['Segunda vela','¡Segunda semana! El angelito ha sacado brillo a la estrella de la clase.','Encended la segunda vela. Hoy, cuida algo que sea de todos: la clase, el patio, los libros.'],
  ['La campana traviesa','Ha tocado la campana antes de tiempo y todos han salido corriendo… ¡a sus sitios!','Hoy, escucha con atención cuando hable la profe o tus compañeros.'],
  ['La Inmaculada','El angelito ha traído flores para la Virgen María, la mamá de Jesús.','Dibuja una flor para María o dile un «gracias» en una oración.'],
  ['El caminito de luz','Ha dejado un caminito de purpurina desde la puerta hasta el belén de la clase.','Sigue el caminito: haz una buena acción cada vez que pases por la puerta.'],
  ['Merienda compartida','El angelito ha partido su galleta en trocitos para que todos prueben.','Comparte tu merienda o un juego en el recreo.'],
  ['Las gracias','Ha escrito «GRACIAS» con plumas de sus alas en la ventana.','Da las gracias a tres personas que te ayudan cada día.'],
  ['Una sonrisa por persona','El angelito ha pintado caritas sonrientes en las ventanas empañadas.','Regala una sonrisa a cada persona que veas hoy.'],
  ['Tercera vela','¡Domingo de la alegría! El angelito no para de reírse.','Encended la tercera vela y cantad juntos la canción del Angelito.'],
  ['El abrazo de paz','Dos amigos se habían enfadado… y el angelito les ha dado un empujoncito.','Si te has enfadado con alguien, perdona y dale la paz.'],
  ['El belén desordenado','¡El burrito está encima del tejado del portal! ¡Ji, ji, ji!','Coloca algo en su sitio y ayuda a preparar el belén de casa o de clase.'],
  ['Las palabras bonitas','Ha escondido palabras bonitas en los cajones: «amigo», «paz», «ayuda»…','Dile algo bonito a cada compañero de tu mesa.'],
  ['Recogiendo plumas','Esta mañana había plumas por todo el pasillo. ¡El angelito ha estado jugando!','Recoge algo del suelo que no sea tuyo y tíralo a la papelera.'],
  ['Una oración por alguien','El angelito ha dejado una estrella con un nombre: alguien que necesita cariño.','Reza por una persona que esté enferma o triste.'],
  ['Villancicos','Han sonado villancicos por los altavoces… ¿quién habrá sido?','Canta un villancico en casa con tu familia.'],
  ['Cuarta vela','¡La corona está completa! El angelito brilla de emoción.','Encended la cuarta vela y rezad juntos la oración del Angelito.'],
  ['El regalo invisible','El angelito dice que el mejor regalo no se envuelve: es el tiempo con los demás.','Juega hoy con alguien que suele estar solo.'],
  ['Preparados','El angelito ha guardado la estrella para llevarla a Belén muy prontito.','Piensa: ¿qué le vas a regalar a Jesús? Díselo en una oración.'],
  ['¡Mañana es Nochebuena!','El angelito está nerviosísimo: no para de volar de un lado a otro.','Ayuda en casa a preparar la cena de Nochebuena.'],
  ['¡Nochebuena!','¡Esta noche nace Jesús! El angelito ya vuela hacia Belén con su estrella.','Mira al cielo esta noche y busca la estrella más brillante. ¡Feliz Navidad!']
];
const COL=['#e2445c','#2f9e5b','#4f7cff','#f5c451','#8e5bd6','#ff8a3d','#5fd3c6','#ff9ec4'];
const R=document.getElementById('rejilla'),profe=document.getElementById('profe'),marca=document.getElementById('marca');
let abiertos=AB.guarda.get('angelito-calendario',[]);profe.checked=AB.guarda.get('angelito-calendario-profe',false);
const hoy=new Date();hoy.setHours(0,0,0,0);
const fechaDe=i=>{const d=new Date(INICIO);d.setDate(d.getDate()+i);return d};
const fmt=d=>d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
// posiciones mezcladas pero siempre iguales
const orden=[...Array(DIAS.length).keys()].sort((a,b)=>((a*17+5)%DIAS.length)-((b*17+5)%DIAS.length));
function pinta(){R.innerHTML='';
  orden.forEach(i=>{const d=fechaDe(i),dom=d.getDay()===0,listo=d<=hoy||profe.checked,ab=abiertos.includes(i);
    const b=document.createElement('button');b.type='button';b.className='puerta'+(ab?' abierta':'')+(!listo?' cerrada':'')+(d.getTime()===hoy.getTime()?' hoy':'')+(dom?' domingo':'');
    b.style.setProperty('--c',COL[i%COL.length]);b.setAttribute('aria-label',`${fmt(d)}${ab?', abierta':listo?'':', todavía no se puede abrir'}`);
    b.innerHTML=`<span class="dentro"><img src="../img/personaje/${['angelito-risa','angelito-yo','angelito-pie','angelito-vuela'][i%4]}.webp" alt=""></span><span class="tapa"><b>${d.getDate()}</b><small>${d.toLocaleDateString('es-ES',{month:'short'}).replace('.','')}</small></span>`;
    b.addEventListener('click',()=>abre(i,listo,b));R.appendChild(b)});
  marca.textContent=`${abiertos.length} / ${DIAS.length}`}
function abre(i,listo,b){const d=fechaDe(i);
  if(!listo){b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300});AB.nota(220,.15,0,'sine');
    const falta=Math.round((d-hoy)/864e5);document.querySelector('.intro').textContent=`¡Paciencia! Esta ventana se abre ${falta===1?'mañana':'dentro de '+falta+' días'}. ¡Ji, ji, ji!`;return}
  if(!abiertos.includes(i)){abiertos.push(i);AB.guarda.set('angelito-calendario',abiertos);b.classList.add('abierta');AB.fanfarria()}else AB.nota(660,.15);
  const [t,tr,re]=DIAS[i];document.getElementById('fecha').textContent=fmt(d);document.getElementById('titulo').textContent=t;
  document.getElementById('travesura').textContent=tr;document.getElementById('reto').textContent='Reto: '+re;
  document.getElementById('angelDia').src=`../img/personaje/${['angelito-risa','angelito-yo','angelito-pie','angelito-vuela'][i%4]}.webp`;
  setTimeout(()=>{document.getElementById('final').hidden=false;document.getElementById('vale').focus()},abiertos.includes(i)?350:650);marca.textContent=`${abiertos.length} / ${DIAS.length}`}
document.getElementById('vale').addEventListener('click',()=>{document.getElementById('final').hidden=true;AB.bien()});
document.getElementById('final').addEventListener('click',e=>{if(e.target.id==='final')e.currentTarget.hidden=true});
profe.addEventListener('change',()=>{AB.guarda.set('angelito-calendario-profe',profe.checked);pinta()});
document.getElementById('cerrar').addEventListener('click',()=>{abiertos=[];AB.guarda.set('angelito-calendario',abiertos);pinta()});
pinta();
})();
</script>
</body>
</html>
