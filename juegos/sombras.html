<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Las sombras · Angelito Burlón</title>
<meta name="description" content="Une cada dibujo del Angelito Burlón con su sombra.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Kurale&family=Nunito:wght@400;800&display=swap">
<link rel="stylesheet" href="juegos.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1f3aa6 0%,var(--noche) 70%) fixed}
main{max-width:1000px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 40px;display:grid;gap:18px;justify-items:center}
.estado{font-family:var(--f-cuento);font-size:1.2rem;color:#dfe5ff;text-align:center;min-height:1.6em;margin:0}
.fila{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(10px,2vw,22px);width:100%;max-width:780px}
.ficha{min-width:0}
.ficha{position:relative;aspect-ratio:1;border-radius:24px;border:3px solid transparent;padding:10px;display:grid;place-items:center;transition:transform .2s,border-color .2s,background .2s}
.obj{background:var(--papel);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.obj.sel{border-color:var(--oro);transform:scale(1.06) rotate(-3deg);box-shadow:0 0 0 4px rgba(245,196,81,.5),0 0 30px rgba(245,196,81,.6)}
.obj.usada{visibility:hidden}
.sombra{background:rgba(255,255,255,.1);border:3px dashed rgba(255,255,255,.35)}
.sombra .dib{filter:brightness(0);opacity:.75}
.sombra.llena{background:var(--papel);border:3px solid #7be3a3}
.sombra.llena .dib{filter:none;opacity:1}
.sombra.ko{animation:temblor .4s}
@keyframes temblor{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dib{width:100%;height:100%;object-fit:contain;pointer-events:none;transition:filter .4s,opacity .4s}
svg.dib{display:block}
.etq{font-weight:800;color:var(--oro-claro);letter-spacing:.04em;text-transform:uppercase;font-size:.85rem;justify-self:start}
</style>
</head>
<body>
<header class="barra">
  <a class="volver" href="../index.html#juego" aria-label="Volver a la web"><span aria-hidden="true">←</span> Volver</a>
  <h1>Las sombras</h1>
  <span class="marca" id="marca"></span>
</header>
<main>
  <div class="niveles" role="group" aria-label="Nivel">
    <button class="btn" data-nivel="3" type="button">3 dibujos</button>
    <button class="btn sec" data-nivel="4" type="button">4 dibujos</button>
  </div>
  <p class="estado" id="estado" aria-live="polite"></p>
  <span class="etq">Los dibujos</span>
  <div class="fila" id="objs"></div>
  <span class="etq">Las sombras</span>
  <div class="fila" id="sombras"></div>
</main>
<div class="panel" id="final" hidden>
  <div class="caja">
    <img class="angel" src="../img/personaje/angelito-risa.webp" alt="">
    <h2>¡Todas en su sombra!</h2>
    <p id="textoFinal"></p>
    <div class="niveles"><button class="btn" id="otraVez" type="button">Jugar otra vez</button><a class="btn sec" href="../index.html#juego" style="text-decoration:none">Otros juegos</a></div>
  </div>
</div>
<script src="comun.js"></script>
<script>
(()=>{
const S=(c)=>`<svg class="dib" viewBox="0 0 100 100" aria-hidden="true">${c}</svg>`;
const DIB=[
  {id:'pie',nom:'el angelito de pie',html:'<img class="dib" src="../img/personaje/angelito-pie.webp" alt="">'},
  {id:'vuela',nom:'el angelito volando',html:'<img class="dib" src="../img/personaje/angelito-vuela.webp" alt="">'},
  {id:'risa',nom:'el angelito riéndose',html:'<img class="dib" src="../img/personaje/angelito-risa.webp" alt="">'},
  {id:'yo',nom:'el angelito saludando',html:'<img class="dib" src="../img/personaje/angelito-yo.webp" alt="">'},
  {id:'estrella',nom:'la estrella',html:S('<path d="M50 6l12.6 28.5 31 3.1-23.3 20.7 6.8 30.4L50 73 22.9 88.7l6.8-30.4L6.4 37.6l31-3.1z" fill="#f5c451" stroke="#b07a12" stroke-width="3" stroke-linejoin="round"/>')},
  {id:'corona',nom:'la corona de un Rey Mago',html:S('<path d="M12 72L8 30l22 18 20-30 20 30 22-18-4 42z" fill="#f5c451" stroke="#b07a12" stroke-width="3" stroke-linejoin="round"/><rect x="12" y="72" width="76" height="12" rx="3" fill="#e0a92a" stroke="#b07a12" stroke-width="3"/><circle cx="50" cy="60" r="7" fill="#e2445c"/><circle cx="28" cy="63" r="5" fill="#3b82f6"/><circle cx="72" cy="63" r="5" fill="#22a06b"/>')},
  {id:'campana',nom:'la campana',html:S('<path d="M50 10c-4 0-6 3-6 6-14 3-22 15-22 32 0 14-6 20-12 26h80c-6-6-12-12-12-26 0-17-8-29-22-32 0-3-2-6-6-6z" fill="#f5c451" stroke="#b07a12" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="84" r="8" fill="#e0a92a" stroke="#b07a12" stroke-width="3"/><path d="M66 12c8 2 14 8 16 16" stroke="#e2445c" stroke-width="6" fill="none" stroke-linecap="round"/>')},
  {id:'vela',nom:'la vela de Adviento',html:S('<path d="M50 8c8 10 9 18 0 24-9-6-8-14 0-24z" fill="#ffb02e" stroke="#e07b00" stroke-width="2"/><rect x="36" y="34" width="28" height="56" rx="4" fill="#8e5bd6" stroke="#5b3596" stroke-width="3"/><path d="M28 90h44" stroke="#5b3596" stroke-width="5" stroke-linecap="round"/>')},
  {id:'arbol',nom:'el árbol de Navidad',html:S('<path d="M50 6L22 40h12L16 64h14L10 86h80L70 64h14L66 40h12z" fill="#2f9e5b" stroke="#1d6b3c" stroke-width="3" stroke-linejoin="round"/><rect x="43" y="86" width="14" height="10" fill="#8a5a2b"/><circle cx="40" cy="52" r="4" fill="#e2445c"/><circle cx="60" cy="70" r="4" fill="#f5c451"/><circle cx="56" cy="36" r="4" fill="#3b82f6"/>')},
  {id:'regalo',nom:'el regalo',html:S('<rect x="14" y="40" width="72" height="50" rx="4" fill="#e2445c" stroke="#9c1f33" stroke-width="3"/><rect x="10" y="28" width="80" height="16" rx="4" fill="#ef6a7f" stroke="#9c1f33" stroke-width="3"/><rect x="44" y="28" width="12" height="62" fill="#f5c451"/><path d="M50 28c-10-18-30-14-22-2 4 5 14 4 22 2zm0 0c10-18 30-14 22-2-4 5-14 4-22 2z" fill="#f5c451" stroke="#b07a12" stroke-width="2.5"/>')},
  {id:'luna',nom:'la luna',html:S('<path d="M62 8a42 42 0 100 84A34 34 0 0162 8z" fill="#ffe7a3" stroke="#d9a93a" stroke-width="3"/>')},
  {id:'camello',nom:'el camello',html:S('<path d="M14 48c0-6 4-10 9-10 4 0 6 3 7 7l2 9c4-14 10-20 18-20 6 0 9 5 12 10 3-5 6-8 11-8 6 0 9 6 10 14l4-2c2-6 6-8 9-6l-3 10-6 6v28h-6V64l-6 4v18h-6V70H44v16h-6V70l-8-6v22h-6V60c-6-2-10-6-10-12z" fill="#d9a35b" stroke="#8a5a2b" stroke-width="3" stroke-linejoin="round"/><circle cx="22" cy="44" r="2" fill="#3b2a1a"/>')}
];
const O=document.getElementById('objs'),Sm=document.getElementById('sombras'),est=document.getElementById('estado'),marca=document.getElementById('marca');
let n,ronda,aciertos,fallos,sel=null;const RONDAS=3;
function empieza(nv){n=+nv;ronda=0;fallos=0;document.getElementById('final').hidden=true;nueva()}
function nueva(){ronda++;aciertos=0;sel=null;O.style.setProperty('--n',n);Sm.style.setProperty('--n',n);O.innerHTML='';Sm.innerHTML='';
  const grupo=AB.baraja(DIB.slice()).slice(0,n);
  grupo.forEach(d=>{const b=document.createElement('button');b.type='button';b.className='ficha obj';b.dataset.id=d.id;b.setAttribute('aria-label',d.nom);b.innerHTML=d.html;
    b.addEventListener('click',()=>{if(b.classList.contains('usada'))return;O.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');AB.nota(520,.1);est.textContent=`Ahora toca la sombra de ${d.nom}.`});O.appendChild(b)});
  AB.baraja(grupo.slice()).forEach(d=>{const b=document.createElement('button');b.type='button';b.className='ficha sombra';b.dataset.id=d.id;b.setAttribute('aria-label','Una sombra');b.innerHTML=d.html;
    b.addEventListener('click',()=>pon(b,d));Sm.appendChild(b)});
  marca.textContent=`Ronda ${ronda} / ${RONDAS}`;est.textContent='Toca un dibujo y después su sombra.'}
function pon(b,d){if(b.classList.contains('llena'))return;if(!sel){est.textContent='Primero toca uno de los dibujos de arriba.';return}
  if(sel.dataset.id===d.id){b.classList.add('llena');b.setAttribute('aria-label',d.nom);sel.classList.remove('sel');sel.classList.add('usada');sel=null;aciertos++;AB.bien();est.textContent=`¡Sí! Esa es la sombra de ${d.nom}.`;
    if(aciertos===n)setTimeout(()=>ronda<RONDAS?nueva():AB.fin(fallos?`Has terminado las ${RONDAS} rondas con solo ${fallos} despiste${fallos>1?'s':''}.`:'¡Sin ningún fallo! Tienes ojos de angelito.'),900)}
  else{fallos++;b.classList.add('ko');setTimeout(()=>b.classList.remove('ko'),450);AB.mal();est.textContent='Esa no es. ¡Fíjate bien en la forma!'}}
document.getElementById('otraVez').addEventListener('click',()=>empieza(n));
empieza(AB.niveles('angelito-sombras-n','3',empieza));
})();
</script>
</body>
</html>
