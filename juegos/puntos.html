<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Une los puntos · Angelito Burlón</title>
<meta name="description" content="Une los puntos en orden y descubre el dibujo del Angelito Burlón.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Kurale&family=Nunito:wght@400;800&display=swap">
<link rel="stylesheet" href="juegos.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1f3aa6 0%,var(--noche) 70%) fixed}
main{max-width:900px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 40px;display:grid;gap:14px;justify-items:center}
.estado{font-family:var(--f-cuento);font-size:1.15rem;color:#dfe5ff;text-align:center;min-height:1.6em;margin:0}
.hoja{position:relative;width:min(100%,560px);background:var(--papel);border-radius:24px;box-shadow:0 14px 34px rgba(0,0,0,.45);border:4px solid var(--oro);padding:6%}
.lamina{position:relative;width:100%}
.lamina svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dibujo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.2s}
.lamina.hecho .dibujo{opacity:1}
.lamina.hecho .pt{opacity:0;transition:opacity .8s}
.pt{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border:0;background:none;padding:0;display:grid;place-items:center;touch-action:manipulation}
.pt::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--tinta);box-shadow:0 0 0 3px #fff}
.pt span{position:absolute;left:24px;top:-4px;font-weight:800;font-size:.95rem;color:var(--tinta);background:rgba(255,246,230,.85);border-radius:6px;padding:0 3px;pointer-events:none}
.pt.ya::before{background:var(--oro);box-shadow:0 0 0 3px #b07a12}
.pt.sig::before{animation:late 1s infinite}
.pt.ko::before{background:#e2445c}
@keyframes late{50%{transform:scale(1.6)}}
</style>
</head>
<body>
<header class="barra">
  <a class="volver" href="../index.html#juego" aria-label="Volver a la web"><span aria-hidden="true">←</span> Volver</a>
  <h1>Une los puntos</h1>
  <span class="marca" id="marca"></span>
</header>
<main>
  <div class="niveles" role="group" aria-label="Dibujo">
    <button class="btn" data-nivel="estrella" type="button">Estrella · 10</button>
    <button class="btn sec" data-nivel="arbol" type="button">Árbol · 15</button>
    <button class="btn sec" data-nivel="campana" type="button">Campana · 17</button>
    <button class="btn sec" data-nivel="pie" type="button">Angelito · 20</button>
    <button class="btn sec" data-nivel="vuela" type="button">¡Vuela! · 20</button>
  </div>
  <p class="estado" id="estado" aria-live="polite">Toca los puntos en orden: 1, 2, 3… ¿Qué dibujo aparecerá?</p>
  <div class="hoja"><div class="lamina" id="lamina"></div></div>
</main>
<div class="panel" id="final" hidden>
  <div class="caja">
    <img class="angel" src="../img/personaje/angelito-risa.webp" alt="">
    <h2 id="tituloFinal">¡Ya está!</h2>
    <p id="textoFinal"></p>
    <div class="niveles"><button class="btn" id="otraVez" type="button">Otro dibujo</button><a class="btn sec" href="../index.html#juego" style="text-decoration:none">Otros juegos</a></div>
  </div>
</div>
<script src="comun.js"></script>
<script>
(()=>{
const estrellaPts=[...Array(10)].map((_,i)=>{const a=-Math.PI/2+i*Math.PI/5,r=i%2?19:46;return[50+r*Math.cos(a),53+r*Math.sin(a)]});
const FIG={
  estrella:{nom:'¡La estrella del angelito!',asp:1,pts:estrellaPts,svg:`<path d="${'M'+estrellaPts.map(p=>p.join(' ')).join('L')}Z" fill="#f5c451" stroke="#b07a12" stroke-width="1.2" stroke-linejoin="round"/>`},
  arbol:{nom:'¡Un árbol de Navidad!',asp:1,pts:[[50,5],[64,25],[57,25],[72,45],[63,45],[80,68],[56,68],[56,84],[44,84],[44,68],[20,68],[37,45],[28,45],[43,25],[36,25]],
    svg:'<path d="M50 5L64 25H57L72 45H63L80 68H56V84H44V68H20L37 45H28L43 25H36Z" fill="#2f9e5b" stroke="#1d6b3c" stroke-width="1.2" stroke-linejoin="round"/><rect x="44" y="68" width="12" height="16" fill="#8a5a2b"/><circle cx="45" cy="38" r="2.5" fill="#e2445c"/><circle cx="58" cy="55" r="2.5" fill="#f5c451"/><circle cx="38" cy="60" r="2.5" fill="#3b82f6"/><circle cx="54" cy="30" r="2.5" fill="#ff9ec4"/>'},
  campana:{nom:'¡Una campana!',asp:1,pts:[[50,8],[58,14],[68,22],[72,38],[74,55],[80,68],[88,76],[60,76],[56,86],[44,86],[40,76],[12,76],[20,68],[26,55],[28,38],[32,22],[42,14]],
    svg:'<path d="M50 8L58 14L68 22L72 38L74 55L80 68L88 76H12L20 68L26 55L28 38L32 22L42 14Z" fill="#f5c451" stroke="#b07a12" stroke-width="1.2" stroke-linejoin="round"/><path d="M60 76L56 86H44L40 76Z" fill="#e0a92a" stroke="#b07a12" stroke-width="1.2"/>'},
  pie:{nom:'¡El Angelito Burlón!',asp:573/787,img:'../img/personaje/angelito-pie.webp',pts:[[49.9,2.4],[68.4,6.4],[78.4,19.1],[89.2,26.9],[93.7,37.2],[88.0,47.6],[96.3,58.7],[80.5,63.8],[70.2,68.0],[68.6,89.7],[49.9,98.2],[31.4,89.2],[30.0,67.6],[23.4,61.8],[8.7,57.4],[9.1,47.6],[3.5,36.7],[11.9,27.4],[19.5,17.3],[31.4,6.4]]},
  vuela:{nom:'¡El angelito volando!',asp:680/614,img:'../img/personaje/angelito-vuela.webp',pts:[[44.4,7.2],[57.6,1.3],[72.8,2.9],[81.8,16.1],[77.5,34.4],[86.5,46.3],[81.9,59.6],[67.4,64.5],[59.7,69.4],[53.7,77.5],[44.4,87.0],[31.3,90.7],[10.0,98.7],[0.0,81.9],[8.1,59.3],[16.5,46.3],[5.3,32.1],[13.8,21.5],[21.9,11.9],[37.2,21.7]]}
};
const L=document.getElementById('lamina'),est=document.getElementById('estado'),marca=document.getElementById('marca');
let clave,f,sig,fallos;
function empieza(k){clave=k;f=FIG[k];sig=0;fallos=0;document.getElementById('final').hidden=true;L.classList.remove('hecho');
  L.style.aspectRatio=f.asp;const dib=f.img?`<img class="dibujo" src="${f.img}" alt="">`:`<svg class="dibujo" viewBox="0 0 100 100" preserveAspectRatio="none">${f.svg}</svg>`;
  L.innerHTML=dib+`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="linea" fill="none" stroke="#1d2454" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke-width:4px;stroke-linecap:round;stroke-linejoin:round"/></svg>`;
  f.pts.forEach(([x,y],i)=>{const b=document.createElement('button');b.type='button';b.className='pt';b.style.left=x+'%';b.style.top=y+'%';b.innerHTML=`<span>${i+1}</span>`;b.setAttribute('aria-label','Punto '+(i+1));
    if(x>85)b.querySelector('span').style.cssText='left:auto;right:24px';b.addEventListener('click',()=>toca(i,b));L.appendChild(b)});
  marca.textContent=`0 / ${f.pts.length}`;est.textContent='Toca los puntos en orden: 1, 2, 3… ¿Qué dibujo aparecerá?'}
function linea(){const p=f.pts.slice(0,sig);if(sig===f.pts.length)p.push(f.pts[0]);document.getElementById('linea').setAttribute('points',p.map(q=>q.join(',')).join(' '))}
function toca(i,b){if(i===sig){b.classList.add('ya');L.querySelectorAll('.sig').forEach(x=>x.classList.remove('sig'));sig++;linea();AB.nota(440*Math.pow(2,(sig%12)/12),.12);marca.textContent=`${sig} / ${f.pts.length}`;
    if(sig===f.pts.length){L.classList.add('hecho');AB.bien();est.textContent=f.nom;document.getElementById('tituloFinal').textContent=f.nom;setTimeout(()=>AB.fin(fallos?`Has unido los ${sig} puntos.`:`Has unido los ${sig} puntos sin equivocarte.`),1300)}
    else est.textContent=`¡Bien! Ahora busca el ${sig+1}.`}
  else if(!b.classList.contains('ya')){fallos++;b.classList.add('ko');setTimeout(()=>b.classList.remove('ko'),400);AB.nota(200,.12,0,'sine',.06);est.textContent=`Ese es el ${i+1}. Busca el ${sig+1}.`;
    if(fallos%2===0)L.querySelectorAll('.pt')[sig].classList.add('sig')}}
document.getElementById('otraVez').addEventListener('click',()=>{const ks=Object.keys(FIG);document.querySelector(`[data-nivel="${ks[(ks.indexOf(clave)+1)%ks.length]}"]`).click()});
empieza(AB.niveles('angelito-puntos-n','estrella',empieza));
})();
</script>
</body>
</html>
