<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Memory del cuento · Angelito Burlón</title>
<meta name="description" content="Juego de parejas con las escenas del cuento Angelito Burlón y la estrella de Navidad.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Kurale&family=Nunito:wght@400;800&display=swap">
<link rel="stylesheet" href="juegos.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1f3aa6 0%,var(--noche) 70%) fixed}
main{max-width:980px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 40px;display:grid;gap:16px;justify-items:center}
.estado{font-family:var(--f-cuento);font-size:1.15rem;color:#dfe5ff;text-align:center;min-height:1.6em}
.tablero{display:grid;gap:clamp(8px,1.6vw,14px);width:100%;perspective:1000px}
.tablero.n6{grid-template-columns:repeat(3,1fr);max-width:640px}
.tablero.n12{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.tablero.n12{grid-template-columns:repeat(3,1fr)}}
.carta{position:relative;aspect-ratio:4/3;border:0;padding:0;background:none;border-radius:16px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.carta.vuelta,.carta.hecha{transform:rotateY(180deg)}
.carta .cara{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.carta .dorso{background:radial-gradient(circle at 50% 45%,#3558d4,#14206a 75%);border:3px solid rgba(245,196,81,.75);display:grid;place-items:center}
.carta .dorso svg{width:38%;color:var(--oro);filter:drop-shadow(0 0 10px rgba(255,214,120,.8))}
.carta .frente{transform:rotateY(180deg);background:var(--papel);border:3px solid var(--oro)}
.carta .frente img{width:100%;height:100%;object-fit:cover}
.carta.hecha .frente{border-color:#fff;box-shadow:0 0 0 3px var(--oro),0 0 26px rgba(255,214,120,.8)}
.carta:not(.vuelta):not(.hecha):hover .dorso{border-color:#fff}
.pie{font-family:var(--f-cuento);color:#b9c3ee;text-align:center;max-width:600px}
</style>
</head>
<body>
<header class="barra">
  <a class="volver" href="../index.html#juego" aria-label="Volver a la web"><span aria-hidden="true">←</span> Volver</a>
  <h1>Memory del cuento</h1>
  <span class="marca" id="marca">Parejas: 0</span>
</header>
<main>
  <div class="niveles" role="group" aria-label="Nivel">
    <button class="btn" data-n="6" type="button">Infantil · 6 cartas</button>
    <button class="btn sec" data-n="12" type="button">1.º a 3.º · 12 cartas</button>
  </div>
  <p class="estado" id="estado" aria-live="polite">Da la vuelta a dos cartas. ¿Encuentras las parejas?</p>
  <div class="tablero" id="tablero"></div>
  <p class="pie">Las escenas son del cuento «Angelito Burlón y la estrella de Navidad».</p>
</main>

<div class="panel" id="final" hidden>
  <div class="caja">
    <img class="angel" src="../img/personaje/angelito-risa.webp" alt="">
    <h2>¡Lo has conseguido!</h2>
    <p id="textoFinal"></p>
    <div class="niveles">
      <button class="btn" id="otraVez" type="button">Jugar otra vez</button>
      <a class="btn sec" href="../index.html#juego" style="text-decoration:none">Otros juegos</a>
    </div>
  </div>
</div>

<script>
(()=>{
const guarda={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ESCENAS=[
  {img:'escena01',txt:'El ángel mayor lee la lista de tareas'},
  {img:'escena02',txt:'El angelito aprende a volar'},
  {img:'escena03',txt:'Dios le da la estrella para que la cuide'},
  {img:'escena04',txt:'El angelito cuida la estrella'},
  {img:'escena05',txt:'¡Esta noche nace Jesús!'},
  {img:'escena06',txt:'Un caminito de luz'},
  {img:'escena07',txt:'Los Reyes Magos siguen la estrella'},
  {img:'escena08',txt:'Llegan al portal de Belén'},
  {img:'escena10a',txt:'El angelito se esconde en clase'}];
const tab=document.getElementById('tablero'),est=document.getElementById('estado'),marca=document.getElementById('marca');
let n=guarda.get('angelito-memory-n',6),abiertas=[],parejas=0,intentos=0,bloqueo=false;
const ESTRELLA='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5l2.7 6.8 7.3.5-5.6 4.7 1.8 7.1L12 16.7l-6.2 3.9 1.8-7.1L2 8.8l7.3-.5z"/></svg>';
let ac=null;function nota(f,d=.2,c=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+c,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const baraja=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function reparte(){parejas=0;intentos=0;abiertas=[];bloqueo=false;document.getElementById('final').hidden=true;
  document.querySelectorAll('[data-n]').forEach(b=>{const si=+b.dataset.n===n;b.classList.toggle('sec',!si);b.setAttribute('aria-pressed',si)});
  const elegidas=baraja(ESCENAS.slice()).slice(0,n/2),cartas=baraja([...elegidas,...elegidas]);
  tab.className='tablero n'+n;tab.innerHTML='';
  cartas.forEach((e,i)=>{const b=document.createElement('button');b.type='button';b.className='carta';b.dataset.id=e.img;b.setAttribute('aria-label',`Carta ${i+1}, boca abajo`);
    b.innerHTML=`<span class="cara dorso">${ESTRELLA}</span><span class="cara frente"><img src="../img/escenas/${e.img}-800.webp" alt="${e.txt}" draggable="false"></span>`;
    b.addEventListener('click',()=>gira(b,e));tab.appendChild(b)});
  marca.textContent=`Parejas: 0 / ${n/2}`;est.textContent='Da la vuelta a dos cartas. ¿Encuentras las parejas?'}

function gira(b,e){if(bloqueo||b.classList.contains('vuelta')||b.classList.contains('hecha'))return;
  b.classList.add('vuelta');b.setAttribute('aria-label',e.txt);nota(520,.12);abiertas.push({b,e});
  if(abiertas.length<2)return;
  intentos++;const [x,y]=abiertas;abiertas=[];
  if(x.e.img===y.e.img){parejas++;setTimeout(()=>{x.b.classList.add('hecha');y.b.classList.add('hecha');[660,880,1100].forEach((f,i)=>nota(f,.25,i*.08))},350);
    est.textContent=`¡Pareja! ${e.txt}.`;marca.textContent=`Parejas: ${parejas} / ${n/2}`;
    if(parejas===n/2)setTimeout(fin,900)}
  else{bloqueo=true;est.textContent='¡Uy! Esas no son iguales. Fíjate bien…';setTimeout(()=>{x.b.classList.remove('vuelta');y.b.classList.remove('vuelta');x.b.setAttribute('aria-label','Carta boca abajo');y.b.setAttribute('aria-label','Carta boca abajo');bloqueo=false},1100)}}

function fin(){[523,659,784,1047].forEach((f,i)=>nota(f,.35,i*.14));
  document.getElementById('textoFinal').textContent=`Has encontrado las ${n/2} parejas en ${intentos} intentos. ¡Tienes una memoria de angelito!`;
  document.getElementById('final').hidden=false;document.getElementById('otraVez').focus()}

document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>{n=+b.dataset.n;guarda.set('angelito-memory-n',n);reparte()}));
document.getElementById('otraVez').addEventListener('click',reparte);
reparte();
})();
</script>
</body>
</html>
