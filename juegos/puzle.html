<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Puzle del cuento · Angelito Burlón</title>
<meta name="description" content="Puzle con las escenas del cuento Angelito Burlón y la estrella de Navidad.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Kurale&family=Nunito:wght@400;800&display=swap">
<link rel="stylesheet" href="juegos.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1f3aa6 0%,var(--noche) 70%) fixed}
main{max-width:1000px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 40px;display:grid;gap:16px;justify-items:center}
.estado{font-family:var(--f-cuento);font-size:1.15rem;color:#dfe5ff;text-align:center;min-height:1.6em;margin:0}
.zona{display:grid;grid-template-columns:1fr 200px;gap:18px;width:100%;align-items:start}
@media (max-width:760px){.zona{grid-template-columns:1fr}.modelo{order:-1;max-width:220px;justify-self:center}}
.tablero{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:3px;padding:3px;border-radius:18px;background:rgba(245,196,81,.5);aspect-ratio:16/9;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pieza{border:0;padding:0;border-radius:6px;background-repeat:no-repeat;transition:transform .2s,box-shadow .2s,filter .2s}
.pieza.sel{transform:scale(.92);box-shadow:0 0 0 4px #fff,0 0 20px rgba(255,255,255,.8);position:relative;z-index:2}
.pieza.bien{filter:none}
.tablero.hecho{gap:0;padding:0;background:none}
.tablero.hecho .pieza{border-radius:0}
.modelo{display:grid;gap:8px;justify-items:center;color:var(--oro-claro);font-weight:800;font-size:.9rem}
.modelo img{width:100%;border-radius:12px;border:3px solid var(--oro)}
</style>
</head>
<body>
<header class="barra">
  <a class="volver" href="../index.html#juego" aria-label="Volver a la web"><span aria-hidden="true">←</span> Volver</a>
  <h1>Puzle del cuento</h1>
  <span class="marca" id="marca"></span>
</header>
<main>
  <div class="niveles" role="group" aria-label="Número de piezas">
    <button class="btn" data-nivel="4" type="button">4 piezas</button>
    <button class="btn sec" data-nivel="6" type="button">6 piezas</button>
    <button class="btn sec" data-nivel="9" type="button">9 piezas</button>
    <button class="btn sec" data-nivel="12" type="button">12 piezas</button>
  </div>
  <p class="estado" id="estado" aria-live="polite">Toca dos piezas para cambiarlas de sitio.</p>
  <div class="zona">
    <div class="tablero" id="tablero"></div>
    <div class="modelo"><span>Así tiene que quedar:</span><img id="modelo" alt=""><button class="btn sec" id="otra" type="button">Otra escena</button></div>
  </div>
</main>
<div class="panel" id="final" hidden>
  <div class="caja">
    <img class="angel" src="../img/personaje/angelito-risa.webp" alt="">
    <h2>¡Puzle terminado!</h2>
    <p id="textoFinal"></p>
    <div class="niveles"><button class="btn" id="otraVez" type="button">Otro puzle</button><a class="btn sec" href="../index.html#juego" style="text-decoration:none">Otros juegos</a></div>
  </div>
</div>
<script src="comun.js"></script>
<script>
(()=>{
const ESC=[['escena02','El angelito aprende a volar'],['escena03','Dios le da la estrella'],['escena04','El angelito cuida la estrella'],['escena05','¡Esta noche nace Jesús!'],['escena06','Un caminito de luz'],['escena07','Los Reyes Magos'],['escena08','El portal de Belén'],['escena10a','El angelito en clase']];
const FORMA={4:[2,2],6:[3,2],9:[3,3],12:[4,3]};
const T=document.getElementById('tablero'),est=document.getElementById('estado'),marca=document.getElementById('marca'),modelo=document.getElementById('modelo');
let n,esc,orden,sel=null,mov,ultima=-1;
function empieza(nv,nueva){n=+nv;if(nueva||!esc){let i;do{i=Math.floor(Math.random()*ESC.length)}while(i===ultima);ultima=i;esc=ESC[i]}
  const [c,f]=FORMA[n];document.getElementById('final').hidden=true;mov=0;sel=null;
  modelo.src=`../img/escenas/${esc[0]}-800.webp`;modelo.alt=esc[1];
  do{orden=AB.baraja([...Array(n).keys()])}while(orden.every((p,i)=>p===i));
  T.style.setProperty('--c',c);T.classList.remove('hecho');T.innerHTML='';
  orden.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='pieza';
    b.style.backgroundImage=`url(../img/escenas/${esc[0]}-800.webp)`;b.style.backgroundSize=`${c*100}% ${f*100}%`;
    b.addEventListener('click',()=>toca(b));T.appendChild(b)});
  pinta();est.textContent='Toca dos piezas para cambiarlas de sitio.'}
function pinta(){const [c,f]=FORMA[n];let bien=0;
  [...T.children].forEach((b,i)=>{const p=orden[i],x=p%c,y=Math.floor(p/c);
    b.style.backgroundPosition=`${c>1?x*100/(c-1):0}% ${f>1?y*100/(f-1):0}%`;b.setAttribute('aria-label',`Pieza ${i+1}`);if(p===i)bien++});
  marca.textContent=`${bien} / ${n} en su sitio`;return bien}
function toca(b){const i=[...T.children].indexOf(b);
  if(sel===null){sel=i;b.classList.add('sel');AB.nota(520,.1);return}
  T.children[sel].classList.remove('sel');if(sel===i){sel=null;return}
  [orden[sel],orden[i]]=[orden[i],orden[sel]];sel=null;mov++;
  const antes=orden[i]===i;if(pinta()===n){T.classList.add('hecho');setTimeout(()=>AB.fin(`«${esc[1]}», en ${mov} movimientos.`),500)}else AB.nota(antes?880:440,.15)}
document.getElementById('otra').addEventListener('click',()=>empieza(n,true));
document.getElementById('otraVez').addEventListener('click',()=>empieza(n,true));
empieza(AB.niveles('angelito-puzle-n','4',v=>empieza(v)));
})();
</script>
</body>
</html>
