<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>La ruleta de gestos · Angelito Burlón</title>
<meta name="description" content="Gira la estrella del Angelito Burlón y descubre el gesto de Adviento de hoy.">
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Kurale&family=Nunito:wght@400;800&display=swap">
<link rel="stylesheet" href="juegos.css">
<style>
body{background:radial-gradient(ellipse at 50% 0%,#1f3aa6 0%,var(--noche) 70%) fixed}
main{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){main{grid-template-columns:1fr;justify-items:center}}
.rueda{position:relative;width:min(100%,520px);aspect-ratio:1;justify-self:center}
.rueda svg.disco{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.12,.75,.18,1);filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}
.rueda .flecha{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:44px;height:56px;z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.rueda button.centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28%;aspect-ratio:1;border-radius:50%;border:5px solid #fff6e6;background:radial-gradient(circle at 50% 40%,#ffe7a3,#f5c451);box-shadow:0 6px 0 #b8862a,0 10px 24px rgba(0,0,0,.4);font-family:var(--f-titulo);font-size:clamp(1.1rem,3vw,1.7rem);color:var(--tinta);line-height:1;padding:6px}
.rueda button.centro:active{transform:translate(-50%,-48%);box-shadow:0 2px 0 #b8862a}
.lado{display:grid;gap:16px;justify-items:center;text-align:center}
.tarjeta{background:var(--papel);color:var(--tinta);border-radius:28px;padding:26px 24px 24px;display:grid;gap:10px;justify-items:center;box-shadow:0 18px 40px rgba(0,0,0,.4);width:min(100%,460px);position:relative}
.tarjeta img{width:110px;margin-top:-70px}
.tarjeta h2{font-family:var(--f-titulo);font-size:clamp(2.2rem,5vw,3.2rem);margin:0;line-height:1}
.tarjeta p{font-family:var(--f-cuento);font-size:clamp(1.15rem,2.4vw,1.45rem);margin:0;color:var(--tinta-suave)}
.tarjeta.nueva{animation:salta .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes salta{from{transform:scale(.6);opacity:0}}
.ya{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:460px}
.ya span{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:.85rem;font-weight:800;color:#dfe5ff}
label.quita{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--oro-claro);cursor:pointer}
label.quita input{width:20px;height:20px;accent-color:var(--oro)}
</style>
</head>
<body>
<header class="barra">
  <a class="volver" href="../index.html#juego" aria-label="Volver a la web"><span aria-hidden="true">←</span> Volver</a>
  <h1>La ruleta de gestos</h1>
</header>
<main>
  <div class="rueda">
    <svg class="flecha" viewBox="0 0 44 56" aria-hidden="true"><path d="M22 54L4 10a18 18 0 1136 0z" fill="#fff6e6" stroke="#1d2454" stroke-width="4"/><circle cx="22" cy="16" r="6" fill="#e2445c"/></svg>
    <svg class="disco" id="disco" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
    <button class="centro" id="girar" type="button">¡Gira!</button>
  </div>
  <div class="lado">
    <div class="tarjeta" id="tarjeta" aria-live="polite">
      <img src="../img/personaje/angelito-yo.webp" alt="">
      <h2 id="gesto">¿Qué toca hoy?</h2>
      <p id="idea">Gira la estrella y el Angelito Burlón te dirá el gesto de Adviento para hoy.</p>
    </div>
    <label class="quita"><input type="checkbox" id="quitar"> Que no se repitan los gestos que ya han salido</label>
    <div class="ya" id="ya"></div>
  </div>
</main>
<script src="comun.js"></script>
<script>
(()=>{
const G=[
  ['Ayudar','Ayuda a alguien hoy sin que te lo pida.','#f5c451'],
  ['Compartir','Comparte algo tuyo: tus colores, un juguete o tu merienda.','#e2445c'],
  ['Perdonar','Si alguien te ha molestado, dale la paz con un abrazo.','#4f7cff'],
  ['Dar las gracias','Da las gracias, de corazón, a tres personas.','#2f9e5b'],
  ['Sonreír','Regala sonrisas a todas las personas que veas.','#ff9ec4'],
  ['Escuchar','Escucha con mucha atención cuando alguien te habla.','#8e5bd6'],
  ['Decir algo bonito','Dile algo bonito a un compañero o a alguien de tu familia.','#ff8a3d'],
  ['Rezar por alguien','Acuérdate de alguien que lo necesita y reza por él.','#5fd3c6']];
const D=document.getElementById('disco'),N=G.length,paso=360/N;
let giro=0,girando=false,salidos=AB.guarda.get('angelito-ruleta-salidos',[]);
const quitar=document.getElementById('quitar');quitar.checked=AB.guarda.get('angelito-ruleta-quitar',false);
function rad(a){return(a-90)*Math.PI/180}
function dibuja(){let s='<circle r="99" fill="#fff6e6"/>';
  G.forEach(([t,,c],i)=>{const a0=rad(i*paso-paso/2),a1=rad(i*paso+paso/2),usado=quitar.checked&&salidos.includes(i);
    s+=`<path d="M0 0L${95*Math.cos(a0)} ${95*Math.sin(a0)}A95 95 0 0 1 ${95*Math.cos(a1)} ${95*Math.sin(a1)}Z" fill="${c}" opacity="${usado?.25:1}" stroke="#fff6e6" stroke-width="1.5"/>`;
    const am=i*paso,pal=t.split(' ');s+=`<g transform="rotate(${am}) translate(0 -62) rotate(${am>90&&am<270?180:0})"><text text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="${t.length>8?9.5:11}" fill="#1d2454" opacity="${usado?.4:1}">${pal.length>2?`<tspan x="0" dy="-3">${pal.slice(0,-1).join(' ')}</tspan><tspan x="0" dy="11">${pal.at(-1)}</tspan>`:pal.length===2&&t.length>11?`<tspan x="0" dy="-3">${pal[0]}</tspan><tspan x="0" dy="11">${pal[1]}</tspan>`:t}</text></g>`});
  for(let i=0;i<N;i++){const a=rad(i*paso+paso/2);s+=`<circle cx="${96*Math.cos(a)}" cy="${96*Math.sin(a)}" r="3" fill="#f5c451" stroke="#b07a12"/>`}
  D.innerHTML=s;
  document.getElementById('ya').innerHTML=salidos.length?'<span style="background:none">Ya han salido:</span>'+salidos.map(i=>`<span>${G[i][0]}</span>`).join(''):''}
document.getElementById('girar').addEventListener('click',()=>{if(girando)return;
  let libres=[...Array(N).keys()];if(quitar.checked){libres=libres.filter(i=>!salidos.includes(i));if(!libres.length){salidos=[];libres=[...Array(N).keys()]}}
  const elegido=libres[Math.floor(Math.random()*libres.length)];girando=true;
  const actual=((giro%360)+360)%360,destino=(360-elegido*paso)%360,extra=(destino-actual+360)%360+360*5+(Math.random()-.5)*paso*.6;
  giro+=extra;D.style.transform=`rotate(${giro}deg)`;
  let t=0;const tic=()=>{if(t>4400)return;AB.nota(1200,.03,0,'square',.025);t+=60+t*.06;setTimeout(tic,60+t*.06)};tic();
  setTimeout(()=>{girando=false;if(!salidos.includes(elegido))salidos.push(elegido);AB.guarda.set('angelito-ruleta-salidos',salidos);
    const tj=document.getElementById('tarjeta');tj.classList.remove('nueva');void tj.offsetWidth;tj.classList.add('nueva');
    document.getElementById('gesto').textContent=G[elegido][0];document.getElementById('idea').textContent=G[elegido][1];AB.fanfarria();AB.lluvia();dibuja()},4700)});
quitar.addEventListener('change',()=>{AB.guarda.set('angelito-ruleta-quitar',quitar.checked);dibuja()});
dibuja();
})();
</script>
</body>
</html>
